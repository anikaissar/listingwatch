name = "kam-status-writer"
main = "src/index.js"
compatibility_date = "2024-11-01"

# Non-secret settings — edit these, then `wrangler deploy`.
[vars]
GITHUB_OWNER = "anikaissar"
GITHUB_REPO = "listingwatch"
GITHUB_BRANCH = "main"
DATA_PATH = "docs/data.json"
ALLOWED_ORIGIN = "https://anikaissar.github.io"

# Secrets — do NOT put these here. Set them with:
#   wrangler secret put GITHUB_TOKEN
#   wrangler secret put API_KEY   (optional but recommended)
