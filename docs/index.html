<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Listing Watch</title>
<style>
  /* Nat Habit brand: committed to light — this page uses the brand's own
     palette rather than adapting to the viewer's OS theme. Colors are still
     declared explicitly (never inherited) so the page holds on any host. */
  :root {
    color-scheme: light;
    --brand:          #c4512a;
    --brand-dark:     #9c3f20;
    --brand-wash:     #fbeee7;
    --surface-1:      #ffffff;
    --plane:          #faf6f3;
    --text-primary:   #241f1c;
    --text-secondary: #6b5f59;
    --text-muted:     #a3968f;
    --gridline:       #ede4de;
    --baseline:       #d9cdc5;
    --border:         rgba(36,31,28,0.10);
    --good:           #0ca30c;
    --warning:        #d98c00;
    --critical:       #d03b3b;
    --seq-550:        #1c5cab;
    --seq-450:        #2a78d6;
    --seq-350:        #5598e7;
    --seq-300:        #6da7ec;
    --seq-250:        #86b6ef;
    --good-wash:      #eaf7ea;
    --warning-wash:   #fdf1de;
    --muted-wash:     #f2ece8;
  }
  * { box-sizing: border-box; }
  html, body {
    background: var(--plane);
    color: var(--text-primary);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    margin: 0;
  }
  body { padding: 24px 20px 64px; }
  .wrap { max-width: 1180px; margin: 0 auto; }

  header.top { margin-bottom: 20px; }
  header.top h1 { font-size: 22px; font-weight: 650; margin: 0 0 4px; }
  header.top p { font-size: 13px; color: var(--text-secondary); margin: 0; line-height: 1.5; }
  .sync-note {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; color: var(--text-muted); margin-top: 8px;
  }
  .sync-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--good); flex: none; }
  .sync-dot.offline { background: var(--critical); }
  .sync-dot.busy { background: var(--warning); }
  .sync-dot.local { background: var(--seq-450); }

  .card {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 12px;
  }

  .stat-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 12px;
    margin-bottom: 16px;
  }
  .stat-tile { padding: 16px 18px; }
  .stat-tile .label {
    font-size: 12px; color: var(--text-secondary);
    display: flex; align-items: center; gap: 6px; margin-bottom: 8px;
  }
  .stat-dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .stat-tile .value { font-size: 30px; font-weight: 650; line-height: 1; }
  .stat-tile .sub { font-size: 12px; color: var(--text-muted); margin-top: 6px; }

  .summary-card { padding: 16px 18px; margin-bottom: 18px; }
  .summary-card summary { font-size: 14px; font-weight: 650; cursor: pointer; }
  .summary-card[open] summary { margin-bottom: 10px; }
  table.summary-tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.summary-tbl th, table.summary-tbl td {
    text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--gridline);
    font-variant-numeric: tabular-nums;
  }
  table.summary-tbl th { color: var(--text-muted); font-weight: 550; font-size: 11px; text-transform: uppercase; letter-spacing: 0.02em; }
  table.summary-tbl td.num { text-align: right; }
  table.summary-tbl tr.total-row td { font-weight: 650; border-top: 1px solid var(--baseline); border-bottom: none; }
  .tier-chip { display: inline-flex; align-items: center; gap: 6px; font-weight: 650; font-size: 12px; }
  .tier-bar { width: 4px; height: 14px; border-radius: 2px; flex: none; }

  .filter-row { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
  .filter-row input[type="search"], .filter-row select {
    background: var(--surface-1); border: 1px solid var(--border); color: var(--text-primary);
    border-radius: 8px; padding: 7px 10px; font-size: 13px; font-family: inherit;
  }
  .filter-row input[type="search"] { min-width: 220px; flex: 1 1 220px; }
  .filter-row .count { font-size: 12px; color: var(--text-muted); margin-left: auto; }
  .filter-row .clear-btn {
    font-size: 12px; color: var(--text-secondary); background: none; border: none;
    cursor: pointer; text-decoration: underline; padding: 0;
  }

  .table-wrap { overflow-x: auto; border-radius: 12px; }
  table.rows-tbl { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 980px; }
  table.rows-tbl th, table.rows-tbl td {
    text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--gridline); vertical-align: top;
  }
  table.rows-tbl th {
    color: var(--text-muted); font-weight: 550; font-size: 11px; text-transform: uppercase;
    letter-spacing: 0.02em; position: sticky; top: 0; background: var(--surface-1);
  }
  table.rows-tbl td.detail-cell { color: var(--text-secondary); max-width: 240px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  table.rows-tbl td.title-cell { color: var(--text-secondary); max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  table.rows-tbl td.num { font-variant-numeric: tabular-nums; text-align: center; }
  table.rows-tbl tr:hover td { background: var(--muted-wash); }

  select.status-select {
    font-family: inherit; font-size: 12px; font-weight: 600; padding: 5px 8px;
    border-radius: 7px; border: 1px solid var(--border); cursor: pointer;
  }
  select.status-select.status-open { background: var(--warning-wash); color: #8a5a00; }
  select.status-select.status-resolved { background: var(--good-wash); color: #0a6b0a; }
  select.status-select.status-not-an-issue { background: var(--muted-wash); color: var(--text-secondary); }

  .empty-state, .loading-state, .error-state { text-align: center; padding: 48px 20px; color: var(--text-muted); font-size: 13px; }
  .status-banner {
    border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 14px; font-size: 12px; color: var(--text-secondary); margin-bottom: 16px; display: none;
  }
  .status-banner.warn { background: var(--warning-wash); }
  .status-banner.info { background: var(--muted-wash); }
  .saving-flag { font-size: 11px; color: var(--text-muted); margin-left: 6px; }

  .brand-header { display: flex; align-items: center; gap: 16px; margin-bottom: 14px; }
  .brand-logo { height: 48px; width: auto; flex: none; display: block; }
  .brand-header .titles h1 { font-size: 22px; font-weight: 650; margin: 0 0 2px; }
  .brand-header .titles p { font-size: 13px; color: var(--text-secondary); margin: 0; line-height: 1.5; }

  .platform-tabs { display: flex; gap: 8px; margin: 4px 0 22px; flex-wrap: wrap; }
  .platform-tab {
    display: flex; align-items: center; gap: 8px;
    padding: 9px 16px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--surface-1); color: var(--text-secondary);
    font-size: 13px; font-weight: 650; font-family: inherit; cursor: pointer;
  }
  .platform-tab .tab-logo { height: 20px; width: auto; flex: none; display: block; }
  .platform-tab[aria-selected="true"] {
    color: var(--text-primary); border-color: var(--brand);
    box-shadow: 0 0 0 1px var(--brand) inset;
  }
  .platform-tab .soon {
    font-size: 10px; font-weight: 650; text-transform: uppercase; letter-spacing: 0.03em;
    color: var(--text-muted); background: var(--muted-wash); border-radius: 5px; padding: 2px 5px;
  }

  .platform-placeholder {
    text-align: center; padding: 64px 20px; color: var(--text-muted); font-size: 13px;
  }
  .platform-placeholder strong { display: block; color: var(--text-secondary); font-size: 15px; font-weight: 650; margin-bottom: 6px; }
</style>
</head>

              <th>D2C title</th>

<script>
// ---- Configuration -----------------------------------------------------
// Set this to your deployed Cloudflare Worker URL (see /worker/README.md).
// Example: "https://kam-status-writer.yourname.workers.dev"
var WORKER_URL = "REPLACE_WITH_WORKER_URL";
var API_KEY = "REPLACE_WITH_API_KEY_OR_LEAVE_BLANK"; // must match the Worker's API_KEY secret, or leave "" if you skipped that step
var DATA_URL = "./data.json";
var POLL_MS = 20000;
// EMBEDDED_DATA lets a preview build inject data directly (window.__DASHBOARD_DATA__
// set in a <script> before this one) instead of fetching DATA_URL — used for reviewing
// the dashboard before it's deployed anywhere. Leave this alone for a real deployment;
// with nothing injected it's just null and the page fetches DATA_URL as normal.
var EMBEDDED_DATA = window.__DASHBOARD_DATA__ || null;
// -------------------------------------------------------------------------

(function () {
  var TIER_ORDER = ["P1", "P2", "P3", "P4"];
  var TIER_COLOR = { P1: "var(--seq-550)", P2: "var(--seq-450)", P3: "var(--seq-350)", P4: "var(--seq-300)" };
  var TIER_MEANING = {
    P1: "Shelf Life Mismatch",
    P2: "Page Broken",
    P3: "Title Mismatch",
    P4: "Product Photo Mismatch"
  };
  // build_kam_review.py has emitted the new 4-tier numbering directly since 2026-09-08
  // (P1 Shelf Life Mismatch, P2 Page Broken, P3 Title Mismatch, P4 Product Photo Mismatch) --
  // r.priority is already correct as-is. There used to be a PRIORITY_REMAP shim here for the
  // old 5-tier source data (old P3/P4/P5 -> new P2/P3/P4); it was left in after the script was
  // updated and was silently re-remapping already-correct values (e.g. real P2 "Page Broken"
  // rows got shown as P1), which is what surfaced this. Removed for good -- do not re-add a
  // remap unless build_kam_review.py's numbering actually changes again.
  var STATUSES = ["Open", "Resolved", "Not an Issue"];
  var BACKEND_CONFIGURED = !!(WORKER_URL && WORKER_URL.indexOf("REPLACE_WITH") !== 0);
  // Column header text per platform tab -- Flipkart's ID is an FSN, Nykaa's
  // is its numeric product ID; same idea, different label.
  var PLATFORM_ID_LABEL = { flipkart: "FSN", nykaa: "Nykaa ID" };
  var PLATFORM_TITLE_LABEL = { flipkart: "Flipkart title", nykaa: "Nykaa title" };

  var allRows = [];
  var localOverrides = {}; // doc_id -> {status, status_changed_at}
  var pollTimer = null;
  // Which platform tab is currently showing real data. Defaults to
  // flipkart (the tab that's selected on page load).
  var currentPlatform = "flipkart";

  // Rows written before the "platform" field existed are all Flipkart --
  // same idea as weekly_refresh.py's load_prior_rows() on the Python side,
  // so old data.json content keeps working with no migration needed.
  function rowPlatform(r) { return r.platform || "flipkart"; }
  function platformId(r) { return r.platform_id || r.fsn || r.nykaa_product_id || ""; }
  function marketplaceTitle(r) { return r.marketplace_title || r.flipkart_title || r.nykaa_title || ""; }

  function escapeHtml(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function statusClass(status) {
    if (status === "Resolved") return "status-resolved";
    if (status === "Not an Issue") return "status-not-an-issue";
    return "status-open";
  }

  function effectiveRows() {
    return allRows.map(function (r) {
      var ov = localOverrides[r.doc_id];
      if (ov) {
        var serverTs = r.status_changed_at ? Date.parse(r.status_changed_at) : 0;
        if (serverTs >= ov.at) {
          delete localOverrides[r.doc_id];
          return r;
        }
        var merged = Object.assign({}, r);
        merged.status = ov.status;
        return merged;
      }
      return r;
    });
  }

  function computeSummary(rows) {
    var byTier = {};
    TIER_ORDER.forEach(function (t) { byTier[t] = { total: 0, Open: 0, Resolved: 0, "Not an Issue": 0, reminders: 0 }; });
    var grand = { total: 0, Open: 0, Resolved: 0, "Not an Issue": 0, reminders: 0 };
    rows.forEach(function (r) {
      var t = byTier[r.priority];
      if (!t) return;
      t.total++; grand.total++;
      var st = STATUSES.indexOf(r.status) >= 0 ? r.status : "Open";
      t[st] = (t[st] || 0) + 1;
      grand[st] = (grand[st] || 0) + 1;
      var rem = Number(r.reminders_sent) || 0;
      t.reminders += rem; grand.reminders += rem;
    });
    return { byTier: byTier, grand: grand };
  }

  function renderStatTiles(grand) {
    var tiles = [
      { label: "Open", value: grand.Open, dot: "var(--warning)", sub: "needs KAM action" },
      { label: "Resolved", value: grand.Resolved, dot: "var(--good)", sub: "fix confirmed" },
      { label: "Not an issue", value: grand["Not an Issue"], dot: "var(--text-muted)", sub: "closed, won't fix" },
      { label: "Total tracked", value: grand.total, dot: "var(--seq-450)", sub: grand.reminders + " reminder-cycles sent" }
    ];
    document.getElementById("statRow").innerHTML = tiles.map(function (t) {
      return '<div class="card stat-tile">' +
        '<div class="label"><span class="stat-dot" style="background:' + t.dot + '"></span>' + escapeHtml(t.label) + '</div>' +
        '<div class="value">' + t.value + '</div>' +
        '<div class="sub">' + escapeHtml(t.sub) + '</div>' +
        '</div>';
    }).join("");
  }

  function renderSummaryTable(byTier, grand) {
    var html = '<thead><tr><th>Priority</th><th>What it means</th><th class="num">Total</th><th class="num">Open</th><th class="num">Resolved</th><th class="num">Not an issue</th><th class="num" title="Total reminder cycles sent to date">Reminders</th></tr></thead><tbody>';
    TIER_ORDER.forEach(function (t) {
      var s = byTier[t];
      html += '<tr><td><span class="tier-chip"><span class="tier-bar" style="background:' + TIER_COLOR[t] + '"></span>' + t + '</span></td>' +
        '<td>' + escapeHtml(TIER_MEANING[t]) + '</td>' +
        '<td class="num">' + s.total + '</td><td class="num">' + s.Open + '</td><td class="num">' + s.Resolved + '</td><td class="num">' + s["Not an Issue"] + '</td><td class="num">' + s.reminders + '</td></tr>';
    });
    html += '<tr class="total-row"><td>Total</td><td></td><td class="num">' + grand.total + '</td><td class="num">' + grand.Open + '</td><td class="num">' + grand.Resolved + '</td><td class="num">' + grand["Not an Issue"] + '</td><td class="num">' + grand.reminders + '</td></tr>';
    html += '</tbody>';
    document.getElementById("summaryTbl").innerHTML = html;
  }

  function currentFilters() {
    return {
      search: document.getElementById("searchInput").value.trim().toLowerCase(),
      tier: document.getElementById("tierFilter").value,
      status: document.getElementById("statusFilter").value
    };
  }

  function applyFilters(rows) {
    var f = currentFilters();
    return rows.filter(function (r) {
      if (rowPlatform(r) !== currentPlatform) return false;
      if (f.tier !== "all" && r.priority !== f.tier) return false;
      if (f.status !== "all" && r.status !== f.status) return false;
      if (f.search) {
        var hay = [r.nh_sku, platformId(r), marketplaceTitle(r), r.d2c_title, r.issue].join(" ").toLowerCase();
        if (hay.indexOf(f.search) === -1) return false;
      }
      return true;
    });
  }

  function sortRows(rows) {
    return rows.slice().sort(function (a, b) {
      var ta = TIER_ORDER.indexOf(a.priority), tb = TIER_ORDER.indexOf(b.priority);
      if (ta !== tb) return ta - tb;
      var sa = a.status === "Open" ? 0 : 1, sb = b.status === "Open" ? 0 : 1;
      if (sa !== sb) return sa - sb;
      return String(a.nh_sku).localeCompare(String(b.nh_sku));
    });
  }

  function showBanner(kind, text) {
    var banner = document.getElementById("statusBanner");
    if (!text) { banner.style.display = "none"; return; }
    banner.className = "status-banner " + kind;
    banner.textContent = text;
    banner.style.display = "block";
  }

  function setSyncState(state, detail) {
    var dot = document.getElementById("syncDot");
    var text = document.getElementById("syncText");
    if (state === "ok") {
      dot.className = "sync-dot"; text.textContent = detail || "Up to date";
    } else if (state === "busy") {
      dot.className = "sync-dot busy"; text.textContent = detail || "Saving…";
    } else if (state === "local") {
      dot.className = "sync-dot local"; text.textContent = detail || "Preview — not connected to a save service";
    } else if (state === "error") {
      dot.className = "sync-dot offline"; text.textContent = detail || "Couldn't reach data.json";
    }
  }

  function onStatusChange(docId, select) {
    var newStatus = select.value;
    var row = allRows.find(function (r) { return r.doc_id === docId; });
    if (!row) return;
    var now = Date.now();
    localOverrides[docId] = { status: newStatus, at: now };
    select.className = "status-select " + statusClass(newStatus);
    var flag = select.parentNode.querySelector(".saving-flag");

    if (!BACKEND_CONFIGURED) {
      // Local-only mode (preview, or a real deployment that hasn't wired up the
      // Worker yet) — apply the edit so the UI is fully testable, but be clear
      // it isn't going anywhere beyond this browser tab.
      row.status = newStatus;
      row.status_changed_at = new Date(now).toISOString();
      delete localOverrides[docId];
      if (flag) flag.textContent = "saved (this tab only)";
      setSyncState("local", "Preview — not connected to a save service");
      showBanner("info", "Not connected to a save service — edits apply here but aren't shared with anyone else. See worker/README.md to wire up real saving.");
      renderAll();
      return;
    }

    if (flag) flag.textContent = "saving…";
    setSyncState("busy", "Saving…");

    var headers = { "Content-Type": "application/json" };
    if (API_KEY && API_KEY.indexOf("REPLACE_WITH") !== 0) headers["X-Api-Key"] = API_KEY;

    fetch(WORKER_URL + "/status", {
      method: "POST",
      headers: headers,
      body: JSON.stringify({ doc_id: docId, status: newStatus })
    }).then(function (res) {
      if (!res.ok) throw new Error("HTTP " + res.status);
      return res.json();
    }).then(function (data) {
      if (data && data.status_changed_at) {
        localOverrides[docId].at = Date.parse(data.status_changed_at) || now;
      }
      if (flag) flag.textContent = "";
      setSyncState("ok", "Saved");
      showBanner("warn", null);
    }).catch(function () {
      if (flag) flag.textContent = "not saved — retry";
      showBanner("warn", "That last Status change couldn't be saved (the save service didn't respond). Try again in a moment — nothing else here is lost, but this edit may not have stuck.");
      setSyncState("error", "Save failed");
    });
  }

  function renderRows() {
    var filtered = sortRows(applyFilters(effectiveRows()));
    document.getElementById("rowCount").textContent = filtered.length + " of " + allRows.length + " rows";
    var body = document.getElementById("rowsBody");
    if (!filtered.length) {
      body.innerHTML = '<tr><td colspan="8" class="empty-state">No rows match these filters.</td></tr>';
      return;
    }
    body.innerHTML = filtered.map(function (r) {
      var opts = STATUSES.map(function (s) {
        return '<option value="' + s + '"' + (r.status === s ? " selected" : "") + '>' + s + '</option>';
      }).join("");
      return '<tr>' +
        '<td><span class="tier-chip" title="' + escapeHtml(TIER_MEANING[r.priority] || "") + '"><span class="tier-bar" style="background:' + (TIER_COLOR[r.priority] || "var(--text-muted)") + '"></span>' + escapeHtml(r.priority) + '</span></td>' +
        '<td>' + escapeHtml(r.nh_sku) + '</td>' +
        '<td>' + escapeHtml(platformId(r)) + '</td>' +
        '<td class="detail-cell" title="' + escapeHtml(r.detail) + '">' + escapeHtml(r.detail) + '</td>' +
        '<td class="title-cell" title="' + escapeHtml(marketplaceTitle(r)) + '">' + escapeHtml(marketplaceTitle(r)) + '</td>' +
        '<td class="title-cell" title="' + escapeHtml(r.d2c_title) + '">' + escapeHtml(r.d2c_title) + '</td>' +
        '<td class="num">' + (Number(r.reminders_sent) || 0) + '</td>' +
        '<td><select class="status-select ' + statusClass(r.status) + '" data-doc="' + escapeHtml(r.doc_id) + '">' + opts + '</select><span class="saving-flag"></span></td>' +
        '</tr>';
    }).join("");
    Array.prototype.forEach.call(body.querySelectorAll("select.status-select"), function (sel) {
      sel.addEventListener("change", function () { onStatusChange(sel.getAttribute("data-doc"), sel); });
    });
  }

  function renderAll() {
    var rows = effectiveRows().filter(function (r) { return rowPlatform(r) === currentPlatform; });
    var summary = computeSummary(rows);
    renderStatTiles(summary.grand);
    renderSummaryTable(summary.byTier, summary.grand);
    renderRows();
  }

  ["searchInput", "tierFilter", "statusFilter"].forEach(function (id) {
    document.getElementById(id).addEventListener("input", renderRows);
    document.getElementById(id).addEventListener("change", renderRows);
  });
  document.getElementById("clearFilters").addEventListener("click", function () {
    document.getElementById("searchInput").value = "";
    document.getElementById("tierFilter").value = "all";
    document.getElementById("statusFilter").value = "all";
    renderRows();
  });

  var PLATFORM_LABELS = { amazon: "Amazon", flipkart: "Flipkart", myntra: "Myntra", nykaa: "Nykaa" };
  // Platforms with a real, wired-up data feed -- everything else still
  // shows the "not connected yet" placeholder. Nykaa joined Flipkart here
  // once nykaa_pdp_scraper.py / nykaa_qa_diff.py / weekly_refresh.py were
  // wired up (2026-09-11).
  var PLATFORMS_WITH_DATA = { flipkart: true, nykaa: true };
  Array.prototype.forEach.call(document.querySelectorAll(".platform-tab"), function (tab) {
    tab.addEventListener("click", function () {
      var platform = tab.getAttribute("data-platform");
      Array.prototype.forEach.call(document.querySelectorAll(".platform-tab"), function (t) {
        t.setAttribute("aria-selected", t === tab ? "true" : "false");
      });
      var hasData = !!PLATFORMS_WITH_DATA[platform];
      document.getElementById("flipkartPanel").hidden = !hasData;
      var placeholder = document.getElementById("platformPlaceholder");
      placeholder.hidden = hasData;
      if (!hasData) {
        document.getElementById("placeholderTitle").textContent = PLATFORM_LABELS[platform] || platform;
        return;
      }
      currentPlatform = platform;
      document.getElementById("thPlatformId").textContent = PLATFORM_ID_LABEL[platform] || "ID";
      document.getElementById("thMarketTitle").textContent = PLATFORM_TITLE_LABEL[platform] || (PLATFORM_LABELS[platform] || platform) + " title";
      renderAll();
    });
  });

  function applyPayload(payload, sourceLabel) {
    allRows = payload.rows || [];
    var when = payload.generated_at ? new Date(payload.generated_at).toLocaleString() : "unknown time";
    setSyncState(BACKEND_CONFIGURED ? "ok" : "local", sourceLabel + " as of " + when);
    if (!BACKEND_CONFIGURED) {
      showBanner("info", "Not connected to a save service — Status edits apply in this browser tab only. See worker/README.md to wire up real saving.");
    }
    renderAll();
  }

  function showLoadError() {
    setSyncState("error", "Couldn't load data.json");
    document.getElementById("rowsBody").innerHTML =
      '<tr><td colspan="8" class="error-state">Couldn\'t load data.json. If this dashboard was just deployed, check that the file exists at the path the page expects; otherwise try reloading.</td></tr>';
    document.getElementById("statRow").innerHTML = "";
    document.getElementById("summaryTbl").innerHTML = "";
  }

  function loadData() {
    if (EMBEDDED_DATA) {
      applyPayload(EMBEDDED_DATA, "Preview data");
      return Promise.resolve();
    }
    return fetch(DATA_URL + "?t=" + Date.now(), { cache: "no-store" })
      .then(function (res) {
        if (!res.ok) throw new Error("HTTP " + res.status);
        return res.json();
      })
      .then(function (payload) { applyPayload(payload, "Data"); })
      .catch(function (err) { showLoadError(); });
  }

  function startPolling() {
    if (pollTimer) clearInterval(pollTimer);
    pollTimer = setInterval(loadData, POLL_MS);
  }

  loadData().then(function () {
    if (!EMBEDDED_DATA) startPolling();
  });
})();
</script>
</body>
</html>
